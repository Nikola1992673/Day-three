<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Адвент-календарь — День 3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1a2a4f 0%, #0c1222 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      color: #fff;
      position: relative;
    }
    .snowflake {
      position: fixed;
      top: -10px;
      color: #fff;
      opacity: 0.8;
      pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
    }
    .card-scene {
      width: 100%;
      max-width: 360px;
      height: 610px;
      perspective: 1200px;
      position: relative;
      z-index: 2;
    }
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.75s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 26px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.55), 0 0 25px rgba(230, 180, 80, 0.2);
    }
    .card.is-flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 26px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 2px solid rgba(245, 215, 130, 0.45);
    }
    .card-front {
      background: linear-gradient(145deg, #162447, #1f4068, #1b1b2f);
      padding: 24px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }
    .header-badge {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #f7d070;
      font-weight: 700;
      background: rgba(247, 208, 112, 0.12);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(247, 208, 112, 0.3);
    }
    .day-circle {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 14px auto;
      border-radius: 50%;
      background: radial-gradient(circle, #e5a93c 0%, #a26b15 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(229, 169, 60, 0.5), inset 0 2px 6px rgba(255,255,255,0.4);
      border: 3px solid #ffe6a3;
    }
    .day-num {
      font-size: 64px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
      line-height: 1;
    }
    .front-greeting {
      font-size: 21px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .front-sub {
      font-size: 13px;
      color: #c4d7ed;
      line-height: 1.5;
      padding: 0 10px;
    }
    .ornament-pattern {
      font-size: 18px;
      letter-spacing: 6px;
      color: #f7d070;
      opacity: 0.85;
      margin: 10px 0;
    }
    .card-back {
      background: linear-gradient(160deg, #101c36 0%, #172442 100%);
      transform: rotateY(180deg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .photo-frame {
      width: 100%;
      height: 205px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #e5a93c;
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
      background: #0d1526;
      flex-shrink: 0;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }
    .back-content {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 12px 14px;
      margin: 10px 0;
      border: 1px solid rgba(255,255,255,0.12);
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .story-title {
      color: #f7d070;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .story-text {
      font-size: 13px;
      line-height: 1.45;
      color: #eaf1fa;
      user-select: text;
    }
    .recipe-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #f39c12, #d35400);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      box-shadow: 0 4px 14px rgba(211, 84, 0, 0.4);
      transition: transform 0.15s, opacity 0.15s;
    }
    .recipe-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .flip-btn-wrapper {
      width: 100%;
    }
    .trigger-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      outline: none;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    .open-tab {
      background: linear-gradient(135deg, #e5a93c, #b37416);
      color: #211300;
      border: 1px solid #ffe394;
    }
    .open-tab:active {
      transform: scale(0.97);
    }
    .close-tab {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .close-tab:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>

        <div>

        </div>

        <div class="flip-btn-wrapper">

          </div>
          <p class="story-text">
            <strong>Роштувань Баба</strong>, или Мордовские посиделки. Мордва приглашает вас на фольклорно-обрядовый праздник <strong>Роштована кудо</strong>!
          </p>
        </div>

        <div>
          <a class="recipe-btn" href="https://rutube.ru/video/81c1f036b1378cb4172c5baaa5dfbf09/?utm_source=embed&utm_medium=referral&utm_campaign=logo&utm_content=81c1f036b1378cb4172c5baaa5dfbf09&utm_term=yastatic.net&t=210" target="_blank" rel="noopener noreferrer">
            <span>▶ Смотреть видео праздника</span>
            <span>➔</span>
          </a>

          <div class="flip-btn-wrapper">
            <button class="trigger-tab close-tab" id="closeBtn">
              <span>✕ Закрыть открытку</span>
            </button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    const card = document.getElementById('adventCard');
    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');

    openBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      card.classList.add('is-flipped');
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      card.classList.remove('is-flipped');
    });

    const snow = document.getElementById('snow-container');
    const flakes = ['❄', '❅', '❆', '•'];
    for (let i = 0; i < 28; i++) {
      const el = document.createElement('div');
      el.className = 'snowflake';
      el.textContent = flakes[Math.floor(Math.random() * flakes.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = (Math.random() * 3 + 3.5) + 's';
      el.style.animationDelay = (Math.random() * 5) + 's';
      el.style.fontSize = (Math.random() * 12 + 10) + 'px';
      snow.appendChild(el);
    }
  </script>
</body>
</html>
